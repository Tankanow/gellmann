description = "Expert review of an AI output: facts, sources, logic, framing, hidden assumptions"
prompt = "Review {{args}} (default: your last output) as the specialist who owns its domain would. One line per finding: <loc>: <tag> <claim>. <what settles it>. Tags: fact (wrong, speculative, overstated, or unsourced claim), source (missing, secondary, or nonexistent citation), logic (non-sequitur, reversed causality, false dichotomy, generalization from one case), onesided (missing stakeholder or counterargument, or loaded one-sided framing), contested (experts would dispute; empirical or values-based), hidden (implicit load-bearing assumption or limitation), vague (not actionable). For prose, run Julian King's nine critical-reviewer prompts: logic, factual claims, one-sidedness, unsupported conclusions, framing bias, contested statements, generalisations, transparency of values/assumptions/limitations, actionability. End with 'N claims need a source or a human.' or 'An expert would sign off.' List; do not fix."
