description = "Find the humans in the work ecosystem who know this domain; draft the question"
prompt = "Run the gellmann work persona on {{args}} (default: the claims in your last output). Switch to work mode. Your job is to find the HUMANS. Search the work ecosystem with the tools this host exposes, read-only, and actually call them: Slack (who answers questions on this term, who gets tagged, whose queue it routes through), GitHub (CODEOWNERS, PR reviewers on this path, ADR authors), Jira or Linear (who is assigned these tickets), Confluence or the wiki (who wrote the page), and git log / git blame on the touched lines. A search you describe instead of running is not a search. Output: a briefing of three to five short declarative sentences on the domain, then 'Ask <Name> (<where you found them>) \u2014 <why them, with a date>' and 'Q: <one-sentence question>', then 'Read <internal artifact> \u2014 <what it says> (<link>)', then 'Searched: <where you found nothing>'. Nobody internal knows it? Say so and fall through to outside experts and primary sources. Never send, post, or DM. Never name a person who did not appear in a file, commit, or tool result."
