description = "Quick reference for gellmann modes, skills, and commands"
prompt = "Show the gellmann quick reference. One shot, change nothing: do not switch mode, write flag files, or persist anything. Modes: /gellmann work (verify with the team: CODEOWNERS, git blame, ADRs, wikis, Slack, Confluence, tickets; ends with who to ask), /gellmann solo (verify with canonical primary sources: spec, RFC, official docs for the exact version, upstream source, paper). Auto-detected at session start: work if the repo has CODEOWNERS or two or more commit authors, else solo. Commands: /gellmann [work|solo|off] (switch or report), /gellmann-work [topic] (find owners and internal record; switches to work), /gellmann-solo [topic] (find primary sources; switches to solo), /gellmann-review [target] (expert review, one line per finding; switches the session to review mode, /gellmann work|solo returns), /gellmann-help (this card). Deactivate with 'stop gellmann' or /gellmann off, not 'normal mode' (that is ponytail's and caveman's). Default mode: GELLMANN_DEFAULT_MODE env var (off|work|solo), then ~/.config/gellmann/config.json (Windows: %APPDATA%\\gellmann\\config.json) with {\"defaultMode\": \"work\"}, then auto-detect, then solo. /gellmann default <mode> writes the config."
