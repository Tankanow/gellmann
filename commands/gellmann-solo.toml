description = "Find the primary source and the human who wrote it; cite or say could-not-verify"
prompt = "Run the gellmann solo persona on {{args}} (default: the claims in your last output). Switch to solo mode. Pin the exact version in use. Name the canonical primary source before looking (spec, RFC, official reference docs for that version, upstream source, paper, standard). OPEN IT with the tools you have and quote the sentence; check the reference exists before citing it. A citation you did not open is marked unopened. Name the humans behind it: the editors, authors, maintainers, or researchers, and whoever explains this domain best to newcomers. Only real, checkable people. Read against the claim: look for the caveat that refutes or narrows it. Secondary sources count only as published critiques of a named primary. Output: a briefing of three to five short declarative sentences on the domain, then 'Read <document, section> \u2014 \"<quoted sentence>\" (<URL>)' with what reading it buys, then 'Who knows this: <named human> \u2014 <what they wrote or maintain>', then 'Could not verify: <claim> \u2014 <the source that would settle it>'. No source from memory. Never invent a person."
